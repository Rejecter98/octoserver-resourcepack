name: Release resource pack

on:
  push:
    branches: [main]
    paths:
      - "pack/**"
      - "skins.yml"
      - "tools/**"
      - "models/**"
      - "server/BetterModel/**"
  workflow_dispatch:
    inputs:
      mc_version:
        description: "마인크래프트 버전 (도감 실루엣 생성용, 비우면 스크립트 기본값)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dogam silhouettes
        run: |
          pip install --quiet pyyaml
          V="${{ github.event.inputs.mc_version }}"
          python3 tools/gen_silhouettes.py ${V:+--version "$V"}
          test -f pack/assets/dogam/items/silhouette/diamond_sword.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/octo-bettermodel
          key: bettermodel-${{ hashFiles('tools/gen_bettermodel.py') }}

      - name: Generate BetterModel pack (assets/bettermodel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 tools/gen_bettermodel.py 2>&1 | tee ci-bettermodel.log
          cat bettermodel_report.json

      - name: Build CosmeticPack.zip
        run: |
          rm -f CosmeticPack.zip
          cd pack
          zip -r -X ../CosmeticPack.zip . -x '*.DS_Store' -x '__MACOSX/*' -x 'assets/dogam/report.json'
          cd ..
          unzip -l CosmeticPack.zip | grep -q ' pack.mcmeta$' || { echo "pack.mcmeta not at zip root"; exit 1; }

      - name: Compute sha1
        id: sha
        run: echo "sha1=$(sha1sum CosmeticPack.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Next tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          max=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name' \
                | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -1)
          echo "tag=v$(( ${max:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Changed skins
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD -- pack/assets/cosmetics \
              | sed -nE 's#.*/(textures|models)/item/([^/]+)\.(png|json)$#\2#p' > changed.txt
            # skins.yml 에서 새로 생기거나 바뀐 스킨 id
            git diff -U0 "$BEFORE" HEAD -- skins.yml \
              | sed -nE 's/^[+-]  ([A-Za-z0-9_]+):\s*$/\1/p' >> changed.txt
          else
            sed -nE 's/^  ([A-Za-z0-9_]+):\s*$/\1/p' skins.yml > changed.txt
          fi
          # 파일 이름(상태별 텍스처 등)을 skins.yml 의 스킨 id 로 바꿔서 스킨 단위로 정리
          python3 - <<'PY'
          import yaml
          ids = sorted(yaml.safe_load(open("skins.yml"))["skins"], key=len, reverse=True)
          out = set()
          for name in open("changed.txt").read().split():
              hit = next((i for i in ids if name == i or name.startswith(i + "_")), None)
              if hit:
                  out.add(hit)
          open("changed.txt", "w").write("".join(f"{i}\n" for i in sorted(out)))
          PY
          {
            echo "sha1: ${{ steps.sha.outputs.sha1 }}"
            echo
            python3 -c "import json;r=json.load(open('pack/assets/dogam/report.json'));print(f\"도감 실루엣: {r['version']} 아이템 {r['items']}개 · 스킨 {r['skins']}개 (회색 대체 {len(r['gray'])}개)\")"
            echo
            python3 -c "import json;r=json.load(open('bettermodel_report.json'));print(f\"BetterModel {r.get('bettermodel','-')} 모델: {', '.join(r['models']) or '없음'} (파일 {r['files']}개)\")"
            echo
            echo "변경된 스킨:"
            if [ -s changed.txt ]; then sed 's/^/- /' changed.txt; else echo "- (스킨 변경 없음)"; fi
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ls -la CosmeticPack.zip skins.yml notes.md
          for i in 1 2 3; do
            if gh release create "${{ steps.tag.outputs.tag }}" CosmeticPack.zip skins.yml \
                 --title "${{ steps.tag.outputs.tag }}" \
                 --notes-file notes.md \
                 --target "${GITHUB_SHA}" 2>&1 | tee -a ci-release.log; then exit 0; fi
            echo "retry $i" | tee -a ci-release.log
            gh release delete "${{ steps.tag.outputs.tag }}" --yes --cleanup-tag 2>&1 | tee -a ci-release.log || true
            sleep 15
          done
          exit 1

      # 로그를 직접 못 읽는 환경을 위해 실패 시 마지막 로그를 주석(annotation)으로 남김
      - name: Report failure log
        if: failure()
        run: |
          for f in ci-*.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done
